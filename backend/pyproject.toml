[project]
name = "report-platform-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "pyarrow>=20,<25",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "cryptography>=44,<48",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
