services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: report_platform
      POSTGRES_USER: report
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - report_platform_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report -d report_platform"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  report_platform_pg:
