unsupported_claims_to_avoid:
- 年度实物净变化为零，不代表营运资金无库存占用。
- 最终合格率含允许返修后的结果，不再乘首检合格率。
- 仅有方案级估值，不反推设备与费用分项。
- 独立约束不可相互抵销。
- 原文未设额外占用率淘汰阈值，也未证明低风险。
- 爬坡已反映在客户导入量，设备时长变化另算。
- 改造计费面积不等于厂房总面积，不含旧仓储。
- 同口径分歧未解释，较新或较大不能自动胜出。
- 两条条件分支不能替代唯一适配结论。
- 年度内部电量预算达标不证明瞬时负荷可接入。
- 首年全员到岗费用不随首年销量比例缩减。
- 购置报价不含另列安装，不得重复计价。
- 不因设备价格改变自动按比例变化。
- 安装与预备费按各自明示基数计取。
- 不得把建设投资改称含融资成本总资金。
- 完整精度计算，仅展示时四舍五入。
- 纯报价变化不自动改变产能或经营单耗；超期需重询。
- 维护费独立固定；线数班次变化需重算人员。
- 数值相同的规模上限与资金来源上限是独立约束。
- 未扣所得税、利息、还本等，不是完整项目现金流。
- 数值约束与证据型条件分开判断。
- 新版本保留历史实绩与原依据，补资料须说明替代关系。
- 预测、询价和内部参数不能证明合同、验收或银行承诺。
- 仅踏勘，未形成全部专项最终结论。
- 未提供的签字合同、授信、试车记录与专项文件不得视为已有。
